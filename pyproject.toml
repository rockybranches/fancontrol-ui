[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fancontrol-ui"
version = "0.2.0"
description = "Monitor and control Linux hwmon fans with a PyQt6 desktop interface"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RockyBranches" }]
keywords = ["fan", "fan-control", "hwmon", "linux", "pyqt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Wayland",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
    "Topic :: System :: Monitoring",
]
dependencies = ["PyQt6>=6.6"]

[project.urls]
Homepage = "https://github.com/rockybranches/fancontrol-ui"
Changelog = "https://github.com/rockybranches/fancontrol-ui/blob/main/CHANGELOG.md"
Documentation = "https://rockybranches.github.io/fancontrol-ui/"
Issues = "https://github.com/rockybranches/fancontrol-ui/issues"
Repository = "https://github.com/rockybranches/fancontrol-ui"

[project.optional-dependencies]
docs = ["mkdocs>=1.6,<2"]
test = ["pytest>=8"]

[project.scripts]
fancontrol-ui = "fancontrol_ui.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
