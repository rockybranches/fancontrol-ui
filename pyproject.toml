[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fancontrol-ui"
version = "0.1.0"
description = "A simple PyQt interface for controlling Linux hwmon fan speeds"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyQt6>=6.6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
fancontrol-ui = "fancontrol_ui.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

