name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - name: Install Qt runtime library
        run: sudo apt-get update && sudo apt-get install --yes libegl1
      - name: Verify tag matches package version
        run: |
          package_version="$(uv run --no-project python -c \
            "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          test "v${package_version}" = "$GITHUB_REF_NAME"
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --frozen --extra test pytest
      - name: Build distributions
        run: uv build
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
